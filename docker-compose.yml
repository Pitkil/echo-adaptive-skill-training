services:
  echo-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RELOAD: "false"
      DB_TYPE: sqlite
      SQLITE_PATH: /workspace/data/echo.db
      UPLOAD_DIR: /workspace/data/uploads
      PUNDITRAG_BASE_URL: ${PUNDITRAG_DOCKER_BASE_URL:-http://host.docker.internal:8000}
      SIMPLEMEM_BASE_URL: ${SIMPLEMEM_DOCKER_BASE_URL:-http://host.docker.internal:8020}
      MICRO_REPRESENTATION_BASE_URL: ${MICRO_REPRESENTATION_DOCKER_BASE_URL:-http://host.docker.internal:8030}
    ports:
      - "${ECHO_PORT:-8010}:8000"
    volumes:
      - echo-data:/workspace/data
    restart: unless-stopped

  micro-detector:
    profiles: ["micro-mock"]
    build:
      context: services/micro_detector
      dockerfile: Dockerfile
    ports:
      - "${MICRO_DETECTOR_PORT:-8030}:8030"
    restart: unless-stopped

volumes:
  echo-data:
