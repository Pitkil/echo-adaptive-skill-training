services:
  echo-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RELOAD: "false"
      DB_TYPE: sqlite
      SQLITE_PATH: /workspace/data/echo.db
      UPLOAD_DIR: /workspace/data/uploads
      PUNDITRAG_IMPORT_BASE_URL: ${PUNDITRAG_DOCKER_IMPORT_BASE_URL:-http://host.docker.internal:8000}
      PUNDITRAG_QUERY_BASE_URL: ${PUNDITRAG_DOCKER_QUERY_BASE_URL:-http://host.docker.internal:8001}
      PUNDITRAG_TIMEOUT_SECONDS: ${PUNDITRAG_TIMEOUT_SECONDS:-180}
      PUNDITRAG_QUERY_TIMEOUT_SECONDS: ${PUNDITRAG_QUERY_TIMEOUT_SECONDS:-60}
      SIMPLEMEM_BASE_URL: ${SIMPLEMEM_DOCKER_BASE_URL:-http://simplemem:8020}
      SIMPLEMEM_API_KEY: ${SIMPLEMEM_API_KEY:-}
      MICRO_REPRESENTATION_BASE_URL: ${MICRO_REPRESENTATION_DOCKER_BASE_URL:-http://host.docker.internal:8030}
      ASR_BASE_URL: ${ASR_DOCKER_BASE_URL:-http://asr:8040}
      EVALUATION_PROFILE_SEED_KEY: ${EVALUATION_PROFILE_SEED_KEY:-}
    depends_on:
      simplemem:
        condition: service_healthy
      asr:
        condition: service_healthy
    ports:
      - "${ECHO_PORT:-8010}:8000"
    volumes:
      - echo-data:/workspace/data
    restart: unless-stopped

  simplemem:
    build:
      context: services/simplemem
      dockerfile: Dockerfile
    environment:
      SIMPLEMEM_HOST: 0.0.0.0
      SIMPLEMEM_PORT: 8020
      SIMPLEMEM_DB_PATH: /data/simplemem.db
      SIMPLEMEM_API_KEY: ${SIMPLEMEM_API_KEY:-}
      SIMPLEMEM_ALLOW_INSECURE_DEV: "false"
    expose:
      - "8020"
    volumes:
      - simplemem-data:/data
    restart: unless-stopped

  micro-detector:
    profiles: ["micro-mock"]
    build:
      context: services/micro_detector
      dockerfile: Dockerfile
    ports:
      - "${MICRO_DETECTOR_PORT:-8030}:8030"
    restart: unless-stopped

  asr:
    build:
      context: services/asr
      dockerfile: Dockerfile
    environment:
      ASR_MODEL_ID: ${ASR_MODEL_ID:-Systran/faster-whisper-tiny}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_DOWNLOAD_ROOT: /models
      ASR_MAX_AUDIO_BYTES: ${ASR_MAX_AUDIO_BYTES:-104857600}
    ports:
      - "${ASR_PORT:-8040}:8040"
    volumes:
      - asr-model-cache:/models
    restart: unless-stopped

volumes:
  echo-data:
  simplemem-data:
  asr-model-cache:
