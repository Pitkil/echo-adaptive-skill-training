services:
  echo-api:
    environment:
      MICRO_REPRESENTATION_BASE_URL: http://micro-detector:8030
    depends_on:
      micro-detector:
        condition: service_healthy

  micro-detector:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
