services:
  echo-api:
    environment:
      SIMPLEMEM_API_KEY: simplemem-loopback-development-key
      SIMPLEMEM_BASE_URL: http://simplemem:8020

  simplemem:
    environment:
      SIMPLEMEM_API_KEY: simplemem-loopback-development-key
      SIMPLEMEM_ALLOW_INSECURE_DEV: "false"
    ports:
      - "127.0.0.1:${SIMPLEMEM_PORT:-8020}:8020"
