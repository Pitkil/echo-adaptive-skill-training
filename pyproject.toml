[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-competition"
version = "0.1.0"
description = "ECHO multi-agent personalized skills training platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bcrypt>=4.0,<4.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.26",
    "openai==3.3.1",
    "passlib[bcrypt]>=1.7",
    "pydantic==2.13.4",
    "PyJWT>=2.8",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["apps/api"]
markers = [
    "integration: tests that exercise an application or service boundary",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["services/punditrag"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
