name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint maintained modules
        run: python -m ruff check apps services tests
      - name: Compile backend
        run: python -m compileall -q apps/api services
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.micro-mock.yml --profile micro-mock config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.micro-real.yml --profile micro-real config --quiet
      - name: Test
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: ./ci-test.db
          RAG_PROVIDER: punditrag
          RAG_FALLBACK_TO_CHROMA: "false"
        run: python -m pytest

  punditrag-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/punditrag
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.5"
          enable-cache: true
      - name: Install locked PunditRAG dependencies
        run: uv sync --frozen --no-dev --no-install-project
      - name: Compile PunditRAG
        run: uv run --no-sync python -m compileall -q app eval test
      - name: Run deterministic PunditRAG regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            test/16_node_rerank.py \
            test/17_text_compress_utils.py \
            test/18_node_answer_output.py \
            test/19_workspace_features.py \
            test/20_rag_reliability.py \
            test/21_reliability_hardening.py
          do
            uv run --no-sync python "$test_file"
          done
