services:
  echo-api:
    environment:
      MICRO_REPRESENTATION_BASE_URL: http://micro-detector:8030
    depends_on:
      micro-detector:
        condition: service_healthy

  micro-detector:
    profiles: ["micro-real"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: services/micro_detector_real/Dockerfile
      args:
        DEBIAN_MIRROR: ${MICRO_DEBIAN_MIRROR:-https://deb.debian.org}
    environment:
      MICRO_MODEL_ROOT: /models
      MICRO_DETECTOR_JOB_STORE: /data/jobs.json
      MICRO_DETECTOR_OFFLINE_MODE: "true"
      MICRO_DETECTOR_MAX_AUDIO_BYTES: ${MICRO_DETECTOR_MAX_AUDIO_BYTES:-104857600}
    volumes:
      - type: bind
        source: ${MICRO_MODEL_WEIGHT_PATH:-./models/micro_detector/wavlm-base-plus/model.safetensors}
        target: /models/wavlm-base-plus/model.safetensors
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MICRO_MODEL_PROTOTYPE_PATH:-./models/micro_detector/behavior_prototypes.pt}
        target: /models/behavior_prototypes.pt
        read_only: true
        bind:
          create_host_path: false
      - ./models/micro_detector/wavlm-base-plus/config.json:/models/wavlm-base-plus/config.json:ro
      - ./models/micro_detector/wavlm-base-plus/preprocessor_config.json:/models/wavlm-base-plus/preprocessor_config.json:ro
      - ${MICRO_REAL_DATA_DIR:-micro-real-data}:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          value=json.load(urllib.request.urlopen('http://127.0.0.1:8030/health',timeout=5));
          assert value.get('status')=='ok' and value.get('mode')=='real'
      interval: 20s
      timeout: 8s
      start_period: 90s
      retries: 12
    ports:
      - "127.0.0.1:${MICRO_DETECTOR_PORT:-8030}:8030"
    restart: unless-stopped

volumes:
  micro-real-data:
